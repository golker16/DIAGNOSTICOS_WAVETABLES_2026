name: Build WTDiag GUI (Windows EXE)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    env:
      APP_NAME: WTDiagGUI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (!(Test-Path "requirements.txt")) { throw "Falta requirements.txt" }
          pip install -r requirements.txt
          pip install pyinstaller

      # (Opcional) sanity check: que los archivos existan
      - name: Validate entrypoint files
        shell: pwsh
        run: |
          if (!(Test-Path "wtgui.py")) { throw "Falta wtgui.py (entrypoint GUI)" }
          if (!(Test-Path "wtdiag.py")) { throw "Falta wtdiag.py (motor)" }

      - name: Build EXE (PyInstaller onedir, windowed)
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name "$env:APP_NAME" `
            wtgui.py

      - name: Upload artifact (EXE folder)
        uses: actions/upload-artifact@v4
        with:
          name: WTDiagGUI-windows-onedir
          path: dist/${{ env.APP_NAME }}/
          if-no-files-found: error

