name: Build WTDiag GUI (Windows EXE)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-2022

    env:
      APP_NAME: WTDiagGUI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if (!(Test-Path "requirements.txt")) { throw "Falta requirements.txt" }
          pip install -r requirements.txt
          pip install pyinstaller

          python -c "import numpy, scipy, soundfile; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('soundfile', soundfile.__version__)"

      - name: Validate entrypoint files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "wtgui.py")) { throw "Falta wtgui.py (entrypoint GUI)" }
          if (!(Test-Path "wtdiag-1.py")) { throw "Falta wtdiag-1.py (core)" }
          if (!(Test-Path "wtdiag-2.py")) { throw "Falta wtdiag-2.py (CLI/front)" }
          if (!(Test-Path "wtdiag.py")) { throw "Falta wtdiag.py (wrapper importable para GUI)" }

      # ✅ Smoke test antes del build (PowerShell-safe)
      - name: Smoke test (generate WAV + run diag)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $py = @"
          import numpy as np
          import soundfile as sf
          from pathlib import Path

          sr = 48000
          dur = 0.2
          t = np.linspace(0, dur, int(sr*dur), endpoint=False)
          x = 0.2*np.sin(2*np.pi*440*t).astype(np.float32)

          tmp = Path("smoke_tmp")
          tmp.mkdir(exist_ok=True)
          wav_path = tmp / "tone.wav"
          out_json = tmp / "tone.descriptor.json"

          sf.write(wav_path, x, sr)
          print("Wrote:", wav_path, "sr=", sr, "n=", len(x))
          "@

          python -c $py

          python wtdiag-2.py diag --wav smoke_tmp/tone.wav --out smoke_tmp/tone.descriptor.json --table-size 2048 --harmonics 64 --bands 128

          if (!(Test-Path "smoke_tmp/tone.descriptor.json")) { throw "Smoke test falló: no se generó descriptor JSON" }
          Write-Host "Smoke test OK: descriptor generado."

      - name: Build EXE (PyInstaller onedir, windowed)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name "$env:APP_NAME" `
            --hidden-import "json" `
            --hidden-import "json.encoder" `
            --hidden-import "json.decoder" `
            --hidden-import "json.scanner" `
            --hidden-import "simplejson" `
            --collect-all "numpy" `
            --collect-all "scipy" `
            --collect-all "soundfile" `
            --add-data "wtdiag-1.py;." `
            --add-data "wtdiag-2.py;." `
            --add-data "wtdiag.py;." `
            wtgui.py

      - name: Upload artifact (EXE folder)
        uses: actions/upload-artifact@v4
        with:
          name: WTDiagGUI-windows-onedir
          path: dist/${{ env.APP_NAME }}/
          if-no-files-found: error

      # ✅ Logs/artifacts para debug (siempre)
      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WTDiagGUI-build-logs
          path: |
            build/
            *.spec
            smoke_tmp/
          if-no-files-found: warn


